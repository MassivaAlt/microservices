version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build: ./services/user-service
    ports:
      - "5001:5001"

  product-service:
    build: ./services/product-service
    ports:
      - "5002:5002"

  order-service:
    build: ./services/order-service
    ports:
      - "5003:5003"
